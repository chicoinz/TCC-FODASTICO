<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criar conta</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>
    <section class="vh-100" style="background-color: #508bfc;">
        <div class="container py-5 h-100">
            <div class="row d-flex justify-content-center align-items-center h-100">
                <div class="col-12 col-md-8 col-lg-6 col-xl-5">
                    <div class="card shadow-2-strong" style="border-radius: 1rem;">
                        <div class="card-body p-5 text-center">
                            <h1>Criar Conta de Cliente</h1>
                            <form action="/usuario/criar" method="POST">
                                <input type="text"  class="form-control form-control-lg" name="nome" required>
                                <label class="form-label">Nome</label><br>
                                <input type="email"  id="typeEmailX-2" class="form-control form-control-lg" name="email" required>
                                <label class="form-label" for="typeEmailX-2">Email</label><br>
                                <input type="password"  id="typePasswordX-2" class="form-control form-control-lg" name="senha" required>
                                <label class="form-label" for="typePasswordX-2">Senha</label><br>
                                <button data-mdb-button-init data-mdb-ripple-init class="btn btn-primary btn-lg btn-block" type="submit">Login</button>
                            </form>
                            <hr class="my-4">
                            <p>Já possui uma conta? <a href="/usuario/login">Faça login!</a></p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        
    </section>
</body>
</html>
