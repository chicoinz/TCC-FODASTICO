<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Criar conta — VACCUM Co.</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link href="/Css/style.css" rel="stylesheet" />
    <link href="/Css/header.css" rel="stylesheet" />
    <script>
      // Aplica o tema antes da primeira pintura para evitar piscada de cor.
      (function () {
        var salvo = localStorage.getItem('darkMode');
        var escuro = salvo === null
          ? window.matchMedia('(prefers-color-scheme: dark)').matches
          : salvo === 'true';
        if (escuro) document.documentElement.classList.add('dark-mode');
      })();
    </script>
  </head>
  <body>
    <header class="app-header">
      <div class="header-container">
        <a class="logo-section" href="/">
          <span class="logo-icon" aria-hidden="true"></span>
          <h1 class="company-name">VACCUM<span> Co.</span></h1>
        </a>
        <div class="header-right">
          <a href="/usuario/login" class="btn-contact">Já tenho conta</a>
          <button
            class="btn-theme"
            id="themeToggle"
            type="button"
            title="Alternar modo noturno"
            aria-label="Alternar modo noturno"
          >
            <span class="theme-icon">🌙</span>
          </button>
        </div>
      </div>
    </header>

    <main class="app-main">
      <section class="auth-section">
        <div class="auth-card">
          <div class="auth-card-body">
            <p class="eyebrow">Novo por aqui?</p>
            <h2 class="mb-1">Crie sua conta de cliente</h2>
            <p class="text-muted mb-3">
              Leva menos de um minuto e libera o acesso à loja do VACCUM.
            </p>

            <form action="/usuario/criar" method="POST" class="auth-form">
              <div class="form-group">
                <label class="form-label" for="nome">Nome completo</label>
                <input
                  type="text"
                  id="nome"
                  class="form-control form-control-lg"
                  name="nome"
                  autocomplete="name"
                  placeholder="Maria da Silva"
                  required
                />
              </div>

              <div class="form-group">
                <label class="form-label" for="email">E-mail</label>
                <input
                  type="email"
                  id="email"
                  class="form-control form-control-lg"
                  name="email"
                  autocomplete="email"
                  placeholder="voce@exemplo.com.br"
                  required
                />
              </div>

              <div class="form-group">
                <label class="form-label" for="senha">Senha</label>
                <input
                  type="password"
                  id="senha"
                  class="form-control form-control-lg"
                  name="senha"
                  autocomplete="new-password"
                  placeholder="••••••••"
                  required
                />
              </div>

              <button class="btn btn-primary btn-lg submit-btn" type="submit">
                Criar conta
              </button>
            </form>

            <hr />

            <p class="text-muted">
              Já possui uma conta? <a href="/usuario/login">Faça login</a>.
            </p>
          </div>
        </div>
      </section>
    </main>

    <script src="/Scripts/theme.js"></script>
  </body>
</html>
