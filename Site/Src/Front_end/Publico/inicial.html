<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VACCUM Co.</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link href="/css/style.css" rel="stylesheet">
    <style>
      /* role buttons styling: uniform size, centered text and visual harmony */
      .roles {display:flex;flex-direction:column;gap:12px;margin-top:6px}
      .role-btn{
        display:block;width:100%;padding:12px 14px;border-radius:10px;border:0;font-size:16px;font-weight:700;text-align:center;color:#fff;text-decoration:none;
        background:linear-gradient(90deg,#6dd5ed,#2193b0);box-shadow:0 8px 20px rgba(2,20,60,0.12);transition:all 0.3s ease;
      }
      .role-btn:hover{transform:translateY(-2px);box-shadow:0 12px 24px rgba(2,20,60,0.18)}
      .role-btn:active{transform:translateY(1px)}
    </style>
</head>
<body>

    <section class="vh-100" style="background-color: #508bfc;">
  <div class="container py-5 h-100">
    <div class="row d-flex justify-content-center align-items-center h-100">
      <h1 class="text-center text-white mb-4">VACCUM Co.</h1>
      <div class="col-12 col-md-8 col-lg-6 col-xl-5">
        <div class="card shadow-2-strong" style="border-radius: 1rem;">
          <div class="card-body p-5 text-center">

            <h3 class="mb-5">Bem vindo a Vaccum!</h3>

                <div class="roles">
              <a class="role-btn" href="usuario/login">Cliente</a>
              <a class="role-btn btn-warning" href="admin/login">Administrador</a>
                </div>

            <!-- Checkbox -->


           
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js" integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js" integrity="sha384-G/EV+4j2dNv+tEPo3++6LCgdCROaejBqfUeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y" crossorigin="anonymous"></script>
</body>
</html>
